<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pomodoro Focus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Pomodoro Focus</p>
          <h1>Stay sharp. Ship one more session.</h1>
          <p class="subhead">
            A focused 25-minute sprint, followed by a 5-minute reset. Simple, calm,
            and ready to track your flow.
          </p>
        </div>
        <div class="mode-toggle" role="group" aria-label="Timer mode">
          <button class="chip" data-mode="work" aria-pressed="true">
            Work 25
          </button>
          <button class="chip" data-mode="break" aria-pressed="false">
            Break 5
          </button>
        </div>
      </header>

      <section class="grid">
        <article class="card timer-card">
          <div class="ring" aria-hidden="true">
            <svg viewBox="0 0 200 200">
              <defs>
                <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#ffb26b" />
                  <stop offset="100%" stop-color="#ff6b6b" />
                </linearGradient>
              </defs>
              <circle class="ring-bg" cx="100" cy="100" r="86" />
              <circle class="ring-progress" cx="100" cy="100" r="86" />
            </svg>
            <div class="ring-content">
              <p class="status" id="statusText">Idle</p>
              <p class="time" id="timeText">25:00</p>
              <p class="hint" id="modeText">Work mode</p>
            </div>
          </div>
          <div class="actions">
            <button class="primary" id="startBtn">Start</button>
            <button class="secondary" id="pauseBtn" disabled>Pause</button>
            <button class="ghost" id="resetBtn">Reset</button>
          </div>
          <p class="fineprint" id="notifyText">Notifications off</p>
        </article>

        <article class="card stats-card">
          <h2>Today</h2>
          <div class="stats">
            <div>
              <p class="stat-label">Completed sessions</p>
              <p class="stat-value" id="sessionsCount">0</p>
            </div>
            <div>
              <p class="stat-label">Focus minutes</p>
              <p class="stat-value" id="focusMinutes">0</p>
            </div>
          </div>
          <div class="note">
            <p class="note-title">Flow tip</p>
            <p class="note-body">Close two tabs before you press start.</p>
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
